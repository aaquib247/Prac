<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>File</title>
    <style>
        h1 {
            color: 5px solid burlywood;
            display: flex;
            align-items: last baseline;
            justify-content: left;
        }

        .controls {
            margin-left: 20px;
            display: flex;
            align-items: center;
            flex-wrap: wrap; 
            gap: 8px;
            margin-bottom: 16px;
        }

        #input{
            gap:10px;
            margin:20px;
        }
    </style>
</head>

<body>
    <h1>File Explorer</h1>

    <div class="controls">
        <button id="expand-all">Expand All</button>
        <button id="collapse-all">Collapse All</button> <br><br>
    </div>
    <input id="search" type="text" placeholder="Search for..."> 
    <div id="tree"></div>
    <script src="index.js"></script>
</body>

</html>
