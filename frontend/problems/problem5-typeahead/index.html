<!DOCTYPE html>
<html>
<head>
  <title>Typeahead</title>
  <style>
    body { font-family: system-ui; padding: 24px; }
    #search { width: 300px; padding: 8px; font-size: 1rem; }
    #suggestions { list-style: none; padding: 0; margin: 0; width: 300px; border: 1px solid #ccc; }
    #suggestions li { padding: 8px; cursor: pointer; }
    #suggestions li:hover { background: #f0f0f0; }
    #suggestions li.active { background: #d0e8ff; }
  </style>
</head>
<body>
  <h1>Typeahead</h1>
  <input id="search" type="text" placeholder="Search todos..." />
  <ul id="suggestions"></ul>
  <script src="app.js"></script>
</body>
</html>
