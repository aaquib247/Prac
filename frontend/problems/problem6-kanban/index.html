<!DOCTYPE html>
<html>

<head>
    <title>Kanban</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div id="board">

        <div class="column" data-col="todo">
            <h2>Todo</h2>
            <div class="card-list"></div>
        </div>

        <div class="column" data-col="inProgress">
            <h2>InProgress</h2>
            <div class="card-list"></div>
        </div>

        <div class="column" data-col="done">
            <h2>Done</h2>
            <div class="card-list"></div>
        </div>

    </div>
   <script src="app.js"></script>
</body>
</html>
