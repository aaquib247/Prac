<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feature Toggle</title>
    <style>
        body { font-family: sans-serif; padding: 24px; }

        #list {
            width: 300px;
            border: 1px solid #ccc;
            padding: 12px;
        }

        /* each row: name left, toggle button right */
        .row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 0;
        }

        .row button {
            min-width: 50px;
            cursor: pointer;
            border: 1px solid #ccc;
        }

        .row button.on { background: #4caf50; color: white; }
        .row button.off { background: #eee; color: #333; }
    </style>
</head>

<body>
    <h1>Feature Toggle</h1>
    <div id="list"></div>

    <script src="app.js"></script>
</body>

</html>
