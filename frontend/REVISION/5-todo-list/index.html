<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo List</title>
    <style>
        body { font-family: sans-serif; padding: 24px; }

        #input {
            border: 1px solid #ccc;
            padding: 8px 12px;
            font-size: 16px;
            width: 220px;
            outline: none;
        }

        #add {
            padding: 8px 16px;
            cursor: pointer;
        }

        #list {
            list-style: none;
            padding: 0;
            margin-top: 16px;
            width: 300px;
        }

        /* each row: text on the left, Delete on the right */
        .row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px;
            border-bottom: 1px solid #eee;
        }

        .row.done .text {
            text-decoration: line-through;
            color: #999;
        }

        .text { cursor: pointer; }
    </style>
</head>

<body>
    <h1>Todo List</h1>

    <input id="input" type="text" placeholder="Add a task...">
    <button id="add">Add</button>

    <ul id="list"></ul>

    <script src="app.js"></script>
</body>

</html>
