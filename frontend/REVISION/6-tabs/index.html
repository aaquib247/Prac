<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabs</title>
    <style>
        body { font-family: sans-serif; padding: 24px; }

        #tab-buttons {
            display: flex;
            gap: 4px;
        }

        #tab-buttons button {
            padding: 10px 20px;
            border: 1px solid #ccc;
            background: #f4f4f4;
            cursor: pointer;
        }

        /* the active tab button stands out */
        #tab-buttons button.active {
            background: white;
            font-weight: bold;
            border-bottom: 2px solid #5C6AC4;
        }

        #tab-content {
            border: 1px solid #ccc;
            padding: 16px;
            min-height: 80px;
        }
    </style>
</head>

<body>
    <h1>Tabs</h1>
    <div id="tab-buttons"></div>
    <div id="tab-content"></div>

    <script src="app.js"></script>
</body>

</html>
