<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>File Explorer</title>
    <style>
        body {
            padding: 8px 16px;
            font-family: sans-serif;
        }

        li {
            list-style: none;
            cursor: pointer;
        }
        /* ul auto-indents each level — that gives the tree hierarchy for free */
    </style>
</head>

<body>
    <h1>File Explorer</h1>
    <button id="expand">Expand All</button>
    <button id="collapse">Collapse All</button>

    <!-- container is a UL (a list). renderNode() fills it with LI items. -->
    <ul id="list"></ul>

    <script src="app.js"></script>
</body>

</html>
