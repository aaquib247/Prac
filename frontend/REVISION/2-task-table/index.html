<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Table</title>
    <style>
        table {
            border-collapse: collapse;
            width: 100%;
        }

        th,
        td {
            border: 2px solid black;
            padding: 8px 16px;
            text-align: left;
        }

        th {
            text-align: center;
            cursor: pointer;
        }

        input {
            border: 2px solid black;
            padding: 8px 12px;
            outline: none;
            width: 250px;
            margin-bottom: 10px;
        }

        button:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }
    </style>
</head>

<body>

    <h1>Task Table</h1>
    <input id="input" type="text" placeholder="Search for Title...">
    <p id="status"></p>
    <table id="table">

        <thead id="thead">
            <tr>
                <th data-col="id">Id</th>
                <th data-col="title">Title</th>
                <th data-col="completed">Completed</th>
                <th data-col="userId">User</th>
            </tr>
        </thead>

        <tbody id="tbody"></tbody>

    </table>

    <button id="prev">Prev</button>
    <span id="info"></span>
    <button id="next">Next</button>

    <script src="app.js"></script>

</body>

</html>
