<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            color: #000000;
            padding: 0;
            background-color: #ffffff;
        }

        h1 {
            color: #333;
        }

        p {
            color: #666;
        }

        .flex-container {
            display: flex;
            padding: 8px;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .flex-container div {
            background-color: green;
            color: black;
            width: 80px;
            height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
        }
    </style>
</head>

<body>
    <h1>Hello, World!</h1>
    <p>Welcome to my website.</p>
    <p>Feel free to explore and learn more about what we offer.</p>
    <div class="flex-container">
        <div>Item 1</div>
        <div>Item 2</div>
        <div>Item 3</div>
    </div>
</body>

</html>
